<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hourglass Mini</title>
  <link rel="stylesheet" href="mini.css" />
</head>
<body>
  <div class="mini" id="mini">
    <div class="mini-bar-fill" id="miniBar"></div>
    <span class="mini-dot"></span>
    <span class="mini-name" id="miniName">No task</span>
    <span class="mini-time" id="miniTime">—:—</span>
    <button class="mini-expand" id="expandBtn" title="Open full app">⤢</button>
  </div>
  <script src="mini.js"></script>
</body>
</html>
